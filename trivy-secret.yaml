rules:
  - id: vite-dhis2-auth
    category: dhis2
    title: Hardcoded VITE_DHIS2_AUTH credential
    severity: HIGH
    regex: (?i)(?P<key>VITE_DHIS2_AUTH)\s*(=|:)\s*.{0,5}["'](?P<secret>[^:"'\n]+:[^"'\n]+)["']
    
allow-rules:
  - id: vite-dhis2-auth default
    description: Default DHIS2 credentials
    regex: VITE_DHIS2_AUTH\s*=\s*["']admin:district["']

disable-allow-rules:
  - tests
